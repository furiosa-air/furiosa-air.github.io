<!doctype html>
<html lang="en">
  <head>
    <base href="/parallelbench/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard - ParallelBench</title>
    <meta
      name="description"
      content="See how accuracy scales with TPS (Tokens Per Step) for each unmasking method on ParallelBench."
    />

    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="assets/theme/furiosa.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/theme/tailwind-config.js"></script>
    </head>
  <body class="bg-white">
    <div id="header-component" class="sticky top-0 z-50 transition-transform duration-300"></div>
    <script>
      (function () {
        let lastScrollY = window.scrollY;
        const header = document.getElementById('header-component');
        window.addEventListener('scroll', function () {
          const y = window.scrollY;
          header.style.transform =
            y > lastScrollY && y > 80 ? 'translateY(-100%)' : 'translateY(0)';
          lastScrollY = y;
        });
      })();
    </script>

    <main>
      <div id="nav-component"></div>
      <div id="leaderboard-component"></div>
    </main>

    <div id="footer-component"></div>

    <script>
      async function loadComponent(componentId, componentFile) {
        try {
          const response = await fetch(`components/${componentFile}`);
          if (!response.ok)
            throw new Error(`HTTP ${response.status} loading ${componentFile}`);
          const html = await response.text();
          document.getElementById(componentId).innerHTML = html;
        } catch (error) {
          console.error(`Error loading ${componentFile}:`, error);
        }
      }

      async function loadAllComponents() {
        await Promise.all([
          loadComponent('header-component', 'header.html'),
          loadComponent('nav-component', 'leaderboard-nav.html'),
          loadComponent('leaderboard-component', 'leaderboard-table.html'),
          loadComponent('footer-component', 'footer.html'),
        ]);

        const commonScript = document.createElement('script');
        commonScript.src = 'js/common.js';
        commonScript.onload = () => {
          const leaderboardScript = document.createElement('script');
          leaderboardScript.src = 'js/leaderboard.js';
          document.body.appendChild(leaderboardScript);
        };
        document.body.appendChild(commonScript);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadAllComponents);
      } else {
        loadAllComponents();
      }
    </script>
  </body>
</html>
